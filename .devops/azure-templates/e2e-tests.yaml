parameters:
  # Required
  - name: "ENVIRONMENT"
    type: string
    values:
      - DEV
      - UAT
    default: DEV
  - name: "CHECKOUT_RESOURCE_REPO_NAME"
    type: string
    default: self
  - name: "USER_WALLET_TOKEN_DEV"
    type: string
    default: ''
  - name: "USER_WALLET_TOKEN_UAT"
    type: string
    default: ''
  - name: "RUN_TEST_FOR"
    type: string
    default: ALL
    values:
      - ALL
      - PAYMENT
      - ONBOARDING


steps:
  - checkout: ${{parameters.CHECKOUT_RESOURCE_REPO_NAME}}
  - bash: |
      echo "current folder: $(pwd)"
      FROM_SOURCE=$(cat .node-version || cat .nvmrc)
      ls .node-version && echo ".node-version found, value: '$(cat .node-version)'" || echo ".node-version not found"
      ls .nvmrc && echo ".nvmrc found, value: '$(cat .nvmrc)'" || echo ".nvmrc not found"
      echo "set FROM_SOURCE='$FROM_SOURCE'"
      echo "##vso[task.setvariable variable=NODE_VERSION]$FROM_SOURCE"
    workingDirectory: ${{ parameters.projectDir }}
    displayName: 'Determine Node.js version from source'
  - task: UseNode@1
    inputs:
      version: $(NODE_VERSION)
    displayName: 'Set up Node.js'
  - script: |
      rm -f e2e-tests/.env && cp e2e-tests/dev.env e2e-tests/.env && sed -i "s/^USER_WALLET_TOKEN.*$/USER_WALLET_TOKEN=${{parameters.USER_WALLET_TOKEN_DEV}}/" e2e-tests/.env
    displayName: 'Set env for E2E test (DEV)'
    condition: and(succeeded(), eq('${{parameters.ENVIRONMENT}}', 'DEV'))
  - script: |
      rm -f e2e-tests/.env && cp e2e-tests/uat.env e2e-tests/.env && sed -i "s/^USER_WALLET_TOKEN.*$/USER_WALLET_TOKEN=${{parameters.USER_WALLET_TOKEN_UAT}}/" e2e-tests/.env
    displayName: 'Set env for E2E test (UAT)'
    condition: and(succeeded(), eq('${{parameters.ENVIRONMENT}}', 'UAT'))

  - script: |
      cd e2e-tests && yarn install
    displayName: 'Yarn install'

  - script: |
      cd e2e-tests && yarn pw:install --with-deps
    displayName: 'Install Playwright browsers'

  - script: |
      cd e2e-tests && yarn pw:test:onboarding
    displayName: 'Playwright E2E tests - Contextual onboarding flow'
    continueOnError: true

  - script: |
      cd e2e-tests && yarn pw:test:guest
    displayName: 'Playwright E2E tests - Guest payment by card flow'
    continueOnError: true

  - script: |
      cd e2e-tests &&  yarn test:NPG
    displayName: 'Yarn test NPG - payment and onboarding flows'
    condition: eq('${{parameters.RUN_TEST_FOR}}', 'ALL')
    continueOnError: true
  - script: |
      cd e2e-tests &&  yarn test:NPG:payment
    displayName: 'Yarn test NPG - payment flow'
    condition: eq('${{parameters.RUN_TEST_FOR}}', 'PAYMENT')
    continueOnError: true
  - script: |
      cd e2e-tests &&  yarn test:NPG:onboarding
    displayName: 'Yarn test NPG - onboarding flow'
    condition: eq('${{parameters.RUN_TEST_FOR}}', 'ONBOARDING')
    continueOnError: true

  - task: PublishTestResults@2
    inputs:
      testResultsFormat: 'JUnit'
      testResultsFiles: '**/*-TEST.xml'
      searchFolder: '$(System.DefaultWorkingDirectory)'
    condition: succeededOrFailed()
